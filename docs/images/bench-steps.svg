<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548">
  <!-- Source of bench-steps.png: rsvg-convert -z 2 -o bench-steps.png bench-steps.svg -->
  <style>
    text { font-family: 'Liberation Sans', Arial, Helvetica, sans-serif; }
    .bg { fill: #ffffff; stroke: #e5e7eb; }
    .lane-pc { fill: #ecfdf5; stroke: #a7f3d0; }
    .lane-phone { fill: #eef2ff; stroke: #c7d2fe; }
    .lane-label { font-size: 13px; font-weight: 700; }
    .pc { fill: #065f46; }
    .phone { fill: #3730a3; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .again { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .key { stroke: #4f46e5; stroke-width: 2.5; }
    .badge { fill: #4f46e5; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .title { font-size: 15px; font-weight: 700; fill: #111827; }
    .sub { font-size: 12.5px; fill: #4b5563; }
    .edge { fill: none; stroke: #334155; stroke-width: 1.6; }
    .dash { stroke-dasharray: 5 4; }
    .label { font-size: 12.5px; font-weight: 700; fill: #334155; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="759" height="547" rx="14"/>

  <!-- Lanes -->
  <rect class="lane-pc" x="16" y="16" width="356" height="516" rx="10"/>
  <text class="lane-label pc" x="194" y="42" text-anchor="middle">Linux PC</text>
  <rect class="lane-phone" x="388" y="16" width="356" height="516" rx="10"/>
  <text class="lane-label phone" x="566" y="42" text-anchor="middle">iPhone 5 · iOS 10.3.4</text>

  <!-- 1 -->
  <rect class="box" x="44" y="64" width="300" height="52" rx="8"/>
  <circle class="badge" cx="58" cy="64" r="12"/>
  <text class="num" x="58" y="68.5" text-anchor="middle">1</text>
  <text class="title" x="194" y="86" text-anchor="middle">Start the bench</text>
  <text class="sub" x="194" y="104" text-anchor="middle">bench/run.sh, port 8080 open</text>

  <!-- 2 -->
  <rect class="box" x="416" y="144" width="300" height="52" rx="8"/>
  <circle class="badge" cx="430" cy="144" r="12"/>
  <text class="num" x="430" y="148.5" text-anchor="middle">2</text>
  <text class="title" x="566" y="166" text-anchor="middle">Point Wi-Fi at the PC</text>
  <text class="sub" x="566" y="184" text-anchor="middle">HTTP Proxy → Manual, port 8080</text>

  <!-- 3 -->
  <rect class="box" x="416" y="224" width="300" height="52" rx="8"/>
  <circle class="badge" cx="430" cy="224" r="12"/>
  <text class="num" x="430" y="228.5" text-anchor="middle">3</text>
  <text class="title" x="566" y="246" text-anchor="middle">Install the certificate</text>
  <text class="sub" x="566" y="264" text-anchor="middle">http://mitm.it, the iOS profile</text>

  <!-- 4 -->
  <rect class="box" x="416" y="304" width="300" height="52" rx="8"/>
  <circle class="badge" cx="430" cy="304" r="12"/>
  <text class="num" x="430" y="308.5" text-anchor="middle">4</text>
  <text class="title" x="566" y="326" text-anchor="middle">Trust the certificate</text>
  <text class="sub" x="566" y="344" text-anchor="middle">About → Certificate Trust Settings</text>

  <!-- 5 -->
  <rect class="box" x="416" y="384" width="300" height="52" rx="8"/>
  <circle class="badge" cx="430" cy="384" r="12"/>
  <text class="num" x="430" y="388.5" text-anchor="middle">5</text>
  <text class="title" x="566" y="406" text-anchor="middle">Clear Safari's cache</text>
  <text class="sub" x="566" y="424" text-anchor="middle">Clear History and Website Data</text>

  <!-- 6 -->
  <rect class="box key" x="416" y="464" width="300" height="52" rx="26"/>
  <circle class="badge" cx="440" cy="464" r="12"/>
  <text class="num" x="440" y="468.5" text-anchor="middle">6</text>
  <text class="title" x="566" y="486" text-anchor="middle">Browse</text>
  <text class="sub" x="566" y="504" text-anchor="middle">HTTP Proxy → Off when the bench stops</text>

  <!-- After a change -->
  <rect class="again" x="44" y="384" width="300" height="52" rx="8"/>
  <text class="title" x="194" y="406" text-anchor="middle">After a change to bench/</text>
  <text class="sub" x="194" y="424" text-anchor="middle">restart bench/run.sh</text>

  <!-- Edges -->
  <path class="edge" d="M344,90 H566 V144" marker-end="url(#arrow)"/>
  <path class="edge" d="M566,196 V224" marker-end="url(#arrow)"/>
  <path class="edge" d="M566,276 V304" marker-end="url(#arrow)"/>
  <path class="edge" d="M566,356 V384" marker-end="url(#arrow)"/>
  <path class="edge" d="M566,436 V464" marker-end="url(#arrow)"/>
  <path class="edge dash" d="M344,410 H416" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="402" text-anchor="middle">again</text>
</svg>
